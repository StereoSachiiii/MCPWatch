<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCPWatch — MCP Observation Proxy</title>
    <meta name="description" content="Real-time inspection dashboard for MCP JSON-RPC traffic">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◇</text></svg>">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header" id="header">
            <div class="header-left">
                <span class="logo">◇ MCPWatch</span>
                <span class="logo-sub">observation proxy</span>
            </div>
            <div class="header-right">
                <div class="header-actions">
                    <button class="action-btn" id="export-json-btn" title="Export logs as JSON">Export JSON</button>
                    <button class="action-btn" id="export-csv-btn" title="Export logs as CSV">Export CSV</button>
                    <button class="action-btn delete-btn" id="clear-btn" title="Clear all logs from database">Clear</button>
                </div>
                <div class="connection-status">
                    <span class="status-dot" id="status-dot"></span>
                    <span id="status-text">connecting...</span>
                </div>
                <span id="client-count" style="font-size:0.75rem;color:var(--text-muted)"></span>
            </div>
        </header>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Messages</div>
                <div class="stat-value cyan" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Requests</div>
                <div class="stat-value green" id="stat-requests">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Avg Latency</div>
                <div class="stat-value amber" id="stat-latency">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Errors</div>
                <div class="stat-value red" id="stat-errors">0</div>
                <div class="stat-subtext" id="stat-error-rate" style="font-size:0.75rem;color:var(--text-muted);margin-top:4px;">0% error rate</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Volume</div>
                <div class="stat-value purple" id="stat-volume">0 B</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Token Estimate</div>
                <div class="stat-value cyan" id="stat-tokens">0</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filter-bar">
            <input type="text" id="search-input" placeholder="search methods, payloads...">
            <button class="filter-btn" data-dir="IN">IN →</button>
            <button class="filter-btn" data-dir="OUT">← OUT</button>
            <button class="filter-btn" data-transport="stdio">stdio</button>
            <button class="filter-btn" data-transport="sse">sse</button>
            <button class="filter-btn" data-transport="http">http</button>
            <button class="filter-btn" data-transport="ebpf">ebpf</button>
            <button class="filter-btn error-filter-btn" id="error-filter-btn" title="Filter errors only">Errors Only</button>
            <button class="filter-btn" id="expand-all-btn" title="Toggle expand all cards">Expand All</button>
        </div>

        <!-- Timeline -->
        <div class="timeline" id="timeline">
            <div class="timeline-empty">
                <div class="icon">◇</div>
                <div>waiting for json-rpc traffic...</div>
                <div style="margin-top:6px;font-size:0.78rem;color:var(--text-muted)">
                    start your mcp server with mcpwatch --wrap
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
